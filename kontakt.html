<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt | PC Master</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container nav">
      <div class="logo">
        <span class="logo-highlight">PC</span> Master
      </div>

      <nav>
        <a href="index.html">Domů</a>
        <a href="galerie.html">Galerie</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container contact-layout">
      <section class="contact-info">
        <p class="eyebrow">Kontakt</p>
        <h1>Rádi vám pomůžeme s výběrem</h1>

        <div class="info-box">
          <p><strong>Adresa:</strong> Karlova 214, Praha 1</p>
          <p><strong>Telefon:</strong> +420 777 123 456</p>
          <p><strong>Email:</strong> info@pcmaster.cz</p>
          <p><strong>Otevírací doba:</strong> Po–Ne 9:00–20:00</p>
        </div>
      </section>

      <section class="contact-form-section">
        <form class="contact-form">
          <label>
            Jméno
            <input type="text" name="name" placeholder="Vaše jméno" />
          </label>

          <label>
            Email
            <input type="email" name="email" placeholder="vas@email.cz" />
          </label>

          <label>
            Dotaz
            <textarea name="message" rows="5" placeholder="Napište nám, co hledáte..."></textarea>
          </label>

          <button type="submit" class="btn btn-primary">Odeslat</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>© 2026 PC Master</p>
      <p>Gaming hardware & custom builds</p>
    </div>
  </footer>
</body>
</html>
